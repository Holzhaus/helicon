---
default_language_version:
    python: python3
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
      hooks:
          - id: check-case-conflict
          - id: check-json
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-toml
          - id: check-xml
          - id: check-yaml
          - id: destroyed-symlinks
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: fix-byte-order-marker
          - id: forbid-new-submodules
          - id: mixed-line-ending
          - id: trailing-whitespace
            exclude: .tsv$
    - repo: https://github.com/codespell-project/codespell
      rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
      hooks:
          - id: codespell
            args: [--ignore-words=.codespellignore]
            exclude_types: [tsv, json]
    - repo: https://github.com/psf/black-pre-commit-mirror
      rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
      hooks:
          - id: black
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 8d1b9cadaf854cb25bb0b0f5870e1cc66a083d6b  # frozen: 0.2.3
      hooks:
          - id: yamlfmt
    - repo: https://github.com/gitleaks/gitleaks
      rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
      hooks:
          - id: gitleaks
    - repo: https://github.com/woodruffw/zizmor-pre-commit
      rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
      hooks:
          - id: zizmor
            args: [--fix=safe]
    - repo: https://github.com/doublify/pre-commit-rust
      rev: eeee35a89e69d5772bdee97db1a6a898467b686e  # frozen: v1.0
      hooks:
          - id: fmt
            args: [--all, --]
          - id: clippy
            args: [--locked, --workspace, --all-features, --all-targets, --, -D, warnings]
    - repo: https://github.com/Holzhaus/sourceheaders
      rev: 37fab20a62cc63ebb9a8855a2ab90ec7dc56cadf  # frozen: v0.0.4
      hooks:
          - id: sourceheaders
    - repo: https://github.com/jorisroovers/gitlint
      rev: acc9d9de6369b76d22cb4167029d2035e8730b98  # frozen: v0.19.1
      hooks:
          - id: gitlint

ci:
    skip: [fmt, clippy]
