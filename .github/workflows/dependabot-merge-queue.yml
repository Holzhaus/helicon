---
name: Dependabot Merge Queue

on: pull_request

permissions: {}

jobs:
    enqueue:
        name: Add to merge queue
        runs-on: ubuntu-latest
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Holzhaus/helicon'
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Enable auto-merge (rebase)
              run: gh pr merge --auto --rebase "${PR_URL}"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
